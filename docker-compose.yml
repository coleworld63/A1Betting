version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "./backend/main.py"]
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - ./backend:/app/backend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile
    command: ["npm", "run", "preview"]
    ports:
      - "5173:5173"
    env_file:
      - .env.example
    volumes:
      - ./frontend:/frontend
